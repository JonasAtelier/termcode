id = "jonasatelier.termcode"
name = "termcode"
version = "1.2.1"
min_herdr_version = "0.9.1"
description = "A VS Code-style code editor and Git panel for a folder, file or repo, as a Code tab in this workspace"
platforms = ["linux"]

[[actions]]
id = "open"
title = "Open a Code tab for this pane's repo or folder"
contexts = ["pane"]
command = ["termcode", "--tab"]

[[panes]]
id = "panel"
title = "Code"
placement = "tab"
command = ["termcode", "panel"]
