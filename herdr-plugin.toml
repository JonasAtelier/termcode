id = "jonas.termcode"
name = "termcode"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Terminal editor and Git panel for a folder, file or repo, as a Ghostty + herdr workspace tab"
platforms = ["linux"]

[[actions]]
id = "open"
title = "Open a Code tab for this pane's repo or folder"
contexts = ["pane"]
command = ["termcode", "--tab"]

[[panes]]
id = "panel"
title = "Code"
placement = "tab"
command = ["termcode", "panel"]
