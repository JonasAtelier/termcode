# A release, run when a version tag is pushed on main (git tag v1.2.0 && git push origin
# v1.2.0): ci.yml's checks on that commit; the tag must name Cargo.toml's (and
# herdr-plugin.toml's) version, be on main, and CHANGELOG.md must date it; the `crates-io`
# environment must require a reviewer; the static amd64 and arm64 .debs built and installed
# on older and newer Debian and Ubuntu; the macOS binaries (Apple Silicon, Intel) built on a
# Mac, the Apple Silicon one started there; then, once the owner approves, `cargo publish`;
# then a GitHub Release with that version's CHANGELOG section, the .debs, the macOS
# archives and SHA256SUMS.
#
# Run from the Actions tab (workflow_dispatch), on a branch or on a tag, it only checks (the
# checks and the environment) and builds the .debs and the macOS archives, which stay on
# the run's page: every publishing job requires a tag *push*.
#
# See AGENTS.md, "Releases", for the environment, reviewer and Trusted Publishing setup.
# The publish job gets a crates.io token for 30 minutes; the
# github-release job alone may write here. A partial release
# (published, no GitHub Release) is finished with "Re-run failed jobs", which leaves the
# publish alone.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The `crates-io` environment must make a person approve. crates.io's Trusted Publishing
  # configuration names this environment, so only a job in it can get a token; this job makes
  # sure the environment still needs a person (a job naming an environment that does not exist
  # creates it, unprotected). No token here, and it fails closed: an environment it cannot
  # read, or without a required reviewer, stops the release before the approval prompt. It runs
  # from the Actions tab too, to check the setup before a tag.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # reading an environment (GET /repos/{repo}/environments/{name})
    steps:
      - name: The crates-io environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/crates-io" --jq '.protection_rules[]?.type') ||
            { echo "::error::cannot read the crates-io environment (missing, or no permission)"; exit 1; }
          grep -qx required_reviewers <<< "$rules" ||
            { echo "::error::the crates-io environment has no required reviewer: set it up as AGENTS.md says"; exit 1; }
          echo "crates-io: a reviewer must approve"

  tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, for the check below

      - name: The tag names the version, is on main, and CHANGELOG.md dates it
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          grep -qx "version = \"$version\"" herdr-plugin.toml || { echo "::error::herdr-plugin.toml: set version = \"$version\""; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          head=$(grep -m1 "^## \[$version\]" CHANGELOG.md) || { echo "::error::CHANGELOG.md has no ## [$version] section"; exit 1; }
          if grep -qi unreleased <<< "$head"; then echo "::error::CHANGELOG.md: date the $version section"; exit 1; fi
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::the $version section is empty"; exit 1; }
          # Every job's Rust is the one ci.yml checked with.
          pin() { grep -oE 'RUSTUP_TOOLCHAIN: [0-9][0-9.]*' "$1" | sort -u || true; }
          rust=$(pin .github/workflows/ci.yml)
          test -n "$rust" && test "$rust" = "$(pin .github/workflows/release.yml)" ||
            { echo "::error::ci.yml and release.yml pin different Rust"; exit 1; }
          echo "termcode $version: tag, main and CHANGELOG agree; $rust"

  # The .debs: static (musl) amd64 and arm64 binaries, installed and run on older and newer
  # Debian and Ubuntu. Read-only and without secrets; kept on the run's page, attached to the
  # Release by github-release.
  debs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust and cargo-deb
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-deb --version 3.8.0 --locked

      - name: Build the packages
        run: scripts/deb.sh

      - name: Install and run on Debian and Ubuntu
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "== $image"
            docker run --rm -v "$PWD/target/deb/debian:/pkg:ro" "$image" sh -ec '
              # A mirror mid-sync fails an update now and then: three tries.
              for try in 1 2 3; do apt-get update -qq >/dev/null && break; [ "$try" = 3 ] && exit 1; sleep 20; done
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/termcode_*_amd64.deb >/dev/null
              termcode --version
              git init -q /tmp/p && echo hi > /tmp/p/a.txt
              # On a 120x30 terminal for 3 s: it must draw and still be running.
              script -qc "stty rows 30 cols 120; TERM=xterm-256color timeout --foreground 3 termcode /tmp/p; echo EXIT=\$?" /dev/null > /tmp/out 2>&1 || true
              grep -q EXPLORER /tmp/out && grep -q EXIT=124 /tmp/out
            '
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termcode-debs
          path: target/deb/debian/*.deb

  # macOS: the Apple Silicon and Intel binaries, built on a Mac (Intel cross-compiled
  # there), the Apple Silicon one started in a terminal: it must draw and keep running.
  # Read-only and without secrets; github-release attaches the archives (the binary, its
  # licence and the crates', the man page, the completions) with SHA256SUMS. A failure
  # here stops the release, as the .debs' does.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      # No build-machine paths in the binaries (they name the runner), as scripts/deb.sh.
      - name: Build
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=."
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done

      # On a 120x30 terminal for 3 s: it must draw and still be running (perl's alarm, as
      # the .debs' test uses timeout, which macOS lacks; 142 = killed by the alarm).
      - name: Start it in a terminal
        run: |
          bin="$PWD/target/aarch64-apple-darwin/release/termcode"
          "$bin" --version
          p="$RUNNER_TEMP/p" && mkdir -p "$p" && git -C "$p" init -q && echo hi > "$p/a.txt"
          script -q "$RUNNER_TEMP/out" sh -c "stty rows 30 cols 120; TERM=xterm-256color perl -e 'alarm 3; exec @ARGV' '$bin' '$p'; echo EXIT=\$?" > /dev/null || true
          grep -q EXPLORER "$RUNNER_TEMP/out" && grep -q EXIT=142 "$RUNNER_TEMP/out" ||
            { echo "::error::termcode did not draw and keep running on macOS"; tail -c 2000 "$RUNNER_TEMP/out" | cat -v; exit 1; }

      - name: Archives
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            d="dist/termcode-$target" && mkdir -p "$d/completions"
            cp "target/$target/release/termcode" LICENSE doc/termcode.1 "$d/"
            cp completions/termcode.bash completions/_termcode completions/termcode.fish "$d/completions/"
            cargo metadata --format-version 1 --locked --filter-platform "$target" | python3 -I scripts/third-party.py > "$d/THIRD-PARTY-LICENSES"
            tar -C dist -czf "dist/termcode-$target.tar.gz" "termcode-$target"
          done
          ls -l dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termcode-macos
          path: dist/*.tar.gz

  # crates.io, after the owner's click: the `crates-io` environment requires their review
  # and only v* tags may use it. Trusted Publishing: crates.io takes GitHub's OIDC token for
  # this workflow file in this environment and gives back a token for 30 minutes, which the
  # auth action's post step revokes when the job ends, failed or not.
  #
  # id-token: write lets any step of this job ask GitHub for such an OIDC token, so nothing in
  # it runs the repository's code: GitHub's checkout, rustup, the auth action (rust-lang's,
  # pinned), and cargo of RUSTUP_TOOLCHAIN packing this commit's files with --no-verify (no
  # build, so no build script; the build was ci's `cargo publish --dry-run --locked` on this
  # same commit, needs: ci). The repository's cargo and rustup configuration would run too (a
  # toolchain file can name its own binaries, a cargo config a credential provider that gets
  # the token), so a release refuses it, first, before any token exists.
  publish:
    needs: [ci, tag, guard, debs, macos] # ci: `cargo publish --dry-run --locked` on this same commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges; this job only
    env:
      # The Rust of ci.yml's dry run (the tag job checks the two agree). The variable wins
      # over any toolchain file.
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No cargo or rustup configuration from the repository
        run: |
          for f in .cargo/config .cargo/config.toml rust-toolchain rust-toolchain.toml; do
            if [ -e "$f" ] || [ -L "$f" ]; then echo "::error::$f in a release: refused"; exit 1; fi
          done

      - name: Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # The first release only: Trusted Publishing is set up in a crate's settings, so the crate
      # must exist; its first version goes out with a token kept in this environment
      # (CARGO_REGISTRY_TOKEN). Then AGENTS.md, "Releases": Trusted Publishing on, the secret
      # deleted, the token revoked, and this step finds nothing.
      - name: A stored token (the first release only)
        id: stored
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi

      # Fails the job with crates.io's reason when the Trusted Publishing configuration does
      # not match (owner, repository, workflow file, environment). Nothing runs between this
      # and the publish.
      - name: A crates.io token (Trusted Publishing)
        id: auth
        if: steps.stored.outputs.found != 'yes'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify

  # Only this job writes to the repository, to create the GitHub Release.
  github-release:
    needs: [publish, debs, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the Release and attach the .debs and the macOS archives
      id-token: write # sign the build provenance (Sigstore, keyless)
      attestations: write # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termcode-debs
          path: debs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termcode-macos
          path: mac

      # Where each file came from (this repository, this workflow, this commit), signed:
      # `gh attestation verify <file> --repo JonasAtelier/termcode` checks it.
      - name: Build provenance for the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            debs/*.deb
            mac/*.tar.gz

      - name: GitHub Release with this version's CHANGELOG section, the .debs, the macOS archives and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          { awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md
            echo; cat doc/release-install.md; } > "$RUNNER_TEMP/notes.md"
          ( cd debs && sha256sum *.deb; cd ../mac && sha256sum *.tar.gz ) > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" debs/*.deb mac/*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "termcode $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
