# A release, run when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0):
# lint and test, build the static amd64 and arm64 packages, install them on older and
# newer Debian and Ubuntu (job `release`), then publish them here (job `publish`): a
# GitHub release and the signed apt repository that this repository's Pages serve
# (branch gh-pages, https://jonasatelier.github.io/termcode).
# Ordinary pushes and pull requests run ci.yml (lint and test) instead.
#
# Secret (repository settings, Actions):
#   APT_SIGNING_KEY  the apt repository's armored private key (scripts/apt-repo.sh)
# Only `publish` gets it, and write access: a crate's build script runs during the build
# and the tests, and must never see either.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # a dry run from the Actions tab: everything but publishing

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep shellcheck clang apt-utils

      # The Rust this is developed with (rustc --version), so a release builds and lints as
      # it did here; a newer stable's new lints would otherwise fail a tag. Bump on purpose.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: The tag names the version in Cargo.toml, and CHANGELOG.md dates it
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          grep -qx "version = \"$version\"" herdr-plugin.toml || { echo "herdr-plugin.toml: set version = \"$version\""; exit 1; }
          head=$(grep -m1 "^## \[$version\]" CHANGELOG.md) || { echo "CHANGELOG.md has no ## [$version] section"; exit 1; }
          case "$head" in *unreleased*) echo "CHANGELOG.md: date the $version section"; exit 1;; esac
          # This version's section, for the release notes.
          awk -v h="## [$version]" 'index($0, h) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > target-notes.md

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build the packages
        run: scripts/deb.sh

      - name: Install and run on Debian and Ubuntu
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "== $image"
            docker run --rm -v "$PWD/target/deb/debian:/pkg:ro" "$image" sh -ec '
              apt-get update -qq >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/termcode_*_amd64.deb >/dev/null
              termcode --version
              git init -q /tmp/p && echo hi > /tmp/p/a.txt
              # On a 120x30 terminal for 3 s: it must draw and still be running.
              script -qc "stty rows 30 cols 120; TERM=xterm-256color timeout --foreground 3 termcode /tmp/p; echo EXIT=\$?" /dev/null > /tmp/out 2>&1 || true
              grep -q EXPLORER /tmp/out && grep -q EXIT=124 /tmp/out
            '
          done

      - uses: actions/upload-artifact@v7
        with:
          name: termcode-debs
          path: |
            target/deb/debian/*.deb
            target-notes.md
          if-no-files-found: ignore

  # Publishing, apart from the build: only this job may write here and has the key.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: termcode-debs
          path: out

      - name: Tools the apt repository needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils

      # Says only whether the key is set (a secret cannot be tested in `if`).
      - name: Ready to publish?
        id: ready
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "publish=yes" >> "$GITHUB_OUTPUT"
          else echo "::warning::APT_SIGNING_KEY is not set: built and tested, not published"; fi

      - name: The GitHub release
        if: steps.ready.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat out/target-notes.md; echo; cat doc/release-install.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" out/target/deb/debian/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "termcode ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md

      - name: Update the apt repository
        if: steps.ready.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apt-pages
          scripts/apt-repo.sh apt-pages out/target/deb/debian/termcode_*.deb
          cd apt-pages
          git config user.name JonasAtelier
          git config user.email 98136255+JonasAtelier@users.noreply.github.com
          git add -A
          git commit -qm "termcode ${GITHUB_REF_NAME#v}" && git push -q
