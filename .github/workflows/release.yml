# A release, run when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0):
# lint and test, build the static amd64 and arm64 packages, install them on older and
# newer Debian and Ubuntu, then publish them on the public termcode-releases repository:
# a GitHub release, its front page, and the signed apt repository its Pages serve.
# Nothing runs on ordinary pushes: this repository is private, and its Actions minutes
# come out of the account's monthly allowance.
#
# Secrets (repository settings, Actions):
#   RELEASES_TOKEN   fine-grained token, Contents: read and write on termcode-releases only
#   APT_SIGNING_KEY  the apt repository's armored private key (scripts/apt-repo.sh)
# Only the publishing steps get them: a crate's build script runs during the build and
# the tests, and must never see either.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # a dry run from the Actions tab: everything but publishing

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep shellcheck clang apt-utils

      # The Rust this is developed with (rustc --version), so a release builds and lints as
      # it did here; a newer stable's new lints would otherwise fail a tag. Bump on purpose.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: The tag names the version in Cargo.toml, and CHANGELOG.md dates it
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          grep -qx "version = \"$version\"" herdr-plugin.toml || { echo "herdr-plugin.toml: set version = \"$version\""; exit 1; }
          head=$(grep -m1 "^## \[$version\]" CHANGELOG.md) || { echo "CHANGELOG.md has no ## [$version] section"; exit 1; }
          case "$head" in *unreleased*) echo "CHANGELOG.md: date the $version section"; exit 1;; esac
          # This version's section, for the release notes.
          awk -v h="## [$version]" 'index($0, h) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > target-notes.md

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build the packages
        run: scripts/deb.sh

      - name: Install and run on Debian and Ubuntu
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "== $image"
            docker run --rm -v "$PWD/target/deb/debian:/pkg:ro" "$image" sh -ec '
              apt-get update -qq >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/termcode_*_amd64.deb >/dev/null
              termcode --version
              git init -q /tmp/p && echo hi > /tmp/p/a.txt
              # On a 120x30 terminal for 3 s: it must draw and still be running.
              script -qc "stty rows 30 cols 120; TERM=xterm-256color timeout --foreground 3 termcode /tmp/p; echo EXIT=\$?" /dev/null > /tmp/out 2>&1 || true
              grep -q EXPLORER /tmp/out && grep -q EXIT=124 /tmp/out
            '
          done

      - uses: actions/upload-artifact@v7
        with:
          name: termcode-debs
          path: target/deb/debian/*.deb

      # Says only whether both secrets are set (a secret cannot be tested in `if`).
      - name: Ready to publish?
        id: ready
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$KEY" ]; then echo "publish=yes" >> "$GITHUB_OUTPUT"
          else echo "::warning::RELEASES_TOKEN or APT_SIGNING_KEY is not set: built and tested, not published"; fi

      - name: Publish on termcode-releases
        if: steps.ready.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          { echo; cat doc/release-install.md; } >> target-notes.md
          gh release create "$GITHUB_REF_NAME" target/deb/debian/*.deb \
            --repo JonasAtelier/termcode-releases \
            --title "termcode ${GITHUB_REF_NAME#v}" \
            --notes-file target-notes.md
          # The front page follows this release's README, with its screenshots.
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/JonasAtelier/termcode-releases.git" releases-page
          scripts/user-readme.sh --releases > releases-page/README.md
          rm -rf releases-page/doc/screenshots && mkdir -p releases-page/doc && cp -r doc/screenshots releases-page/doc/
          cd releases-page
          git config user.name JonasAtelier
          git config user.email 98136255+JonasAtelier@users.noreply.github.com
          git add -A
          git diff --cached --quiet || { git commit -qm "README for termcode ${GITHUB_REF_NAME#v}" && git push -q; }

      - name: Update the apt repository
        if: steps.ready.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/JonasAtelier/termcode-releases.git" apt-pages
          scripts/apt-repo.sh apt-pages target/deb/debian/termcode_*.deb
          cd apt-pages
          git config user.name JonasAtelier
          git config user.email 98136255+JonasAtelier@users.noreply.github.com
          git add -A
          git commit -qm "termcode ${GITHUB_REF_NAME#v}" && git push -q
