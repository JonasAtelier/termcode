[package]
name = "termcode"
version = "0.5.0"
edition = "2021"
description = "A VS Code-style code editor and Git panel in the terminal"
rust-version = "1.93"
repository = "https://github.com/JonasAtelier/termcode"
# Releases (.debs, the apt repository) and issues.
homepage = "https://github.com/JonasAtelier/termcode-releases"
license = "MIT"
readme = "README.md"
keywords = ["editor", "terminal", "git", "tui", "vscode"]
categories = ["text-editors", "command-line-utilities", "development-tools"]
# The crate: the code, what it embeds, its docs; not the screenshots or release tooling.
include = ["src/**", "assets/**", "examples/**", "skills/**", "doc/termcode.1", "completions/**", "LICENSE", "README.md", "CHANGELOG.md"]

# Build with scripts/deb.sh (static amd64 and arm64 binaries, no build-machine paths),
# install with `sudo apt install ./target/deb/debian/termcode_*.deb`.
[package.metadata.deb]
maintainer = "JonasAtelier"
copyright = "2026 JonasAtelier"
section = "editors"
depends = "git, ripgrep" # the binary is static (scripts/deb.sh): no libc to depend on
# apt installs Recommends (and theirs) by default. xclip copies where the terminal has no
# OSC 52 (GNOME Terminal), on X11 and through XWayland, for ~15 small packages;
# wl-clipboard recommends a desktop's worth (150+ on a bare system) and clang pulls in
# LLVM, so those two are only suggested.
recommends = "xclip, shellcheck"
suggests = "wl-clipboard, clang, gh"
extended-description = """\
A VS Code-style code editor and Git panel that runs inside the terminal, like vim, \
or as a Code tab in a herdr workspace. To add the Code tab to herdr, run: \
herdr plugin link /usr/share/termcode"""
assets = [
    ["target/release/termcode", "usr/bin/", "755"],
    ["herdr-plugin.toml", "usr/share/termcode/", "644"],
    ["scripts/setup.sh", "usr/share/termcode/setup.sh", "755"],
    ["target/README.md", "usr/share/doc/termcode/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/termcode/", "644"],
    ["target/termcode.1.gz", "usr/share/man/man1/", "644"],
    ["completions/termcode.bash", "usr/share/bash-completion/completions/termcode", "644"],
    ["completions/_termcode", "usr/share/zsh/vendor-completions/", "644"],
    ["completions/termcode.fish", "usr/share/fish/vendor_completions.d/", "644"],
    # Debian's machine-readable copyright: termcode's license and each bundled one
    # (written by scripts/deb.sh).
    ["target/copyright", "usr/share/doc/termcode/copyright", "644"],
    ["target/THIRD-PARTY-LICENSES", "usr/share/doc/termcode/", "644"],
]

[dependencies]
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
serde_json = "1"
# Newlines and filter text found fast in big logs (logview.rs).
memchr = "2"
# The minimap's glyphs: the monospace font's characters shrunk to a few pixels (minimap.rs).
fontdue = "0.9"
# Line alignment for the side-by-side diff editor.
similar = "3"
# JS-style regexes from indentRainbow.ignoreLinePatterns; already in the tree via syntect.
fancy-regex = "0.16"
# Cell widths for CJK/wide characters in cursor and column math (already in the tree via ratatui).
unicode-width = "0.2"
# Pure-Rust regex backend (fancy-regex); no onig/C build.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
vt100 = "0.16"
# GitHub sign-in from a phone: the device page as a QR code (no image or SVG output).
qrcode = { version = "0.14.1", default-features = false }
xcomm = "0.1.2"

# vt100 0.15 laid a scrollback view taller than the screen out with a subtraction that
# wraps (as release builds do) to the right rows; with overflow checks it would panic.
# Kept for 0.16 until checked without it.
# Releases (scripts/deb.sh): one LTO unit across all crates, about a quarter smaller and
# 7-9% faster than `release`, a fifth slower to build; `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"

[profile.dev.package.vt100]
overflow-checks = false
